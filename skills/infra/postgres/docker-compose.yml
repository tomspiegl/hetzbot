services:
  postgres:
    # Built locally so we can layer in per-host extensions (e.g. pg_partman)
    # without depending on a registry mirror. POSTGRES_IMAGE / POSTGRES_EXTRA_PKGS
    # are set by deploy.sh from hosts.tfvars (postgres_image / postgres_extra_pkgs).
    build:
      context: .
      args:
        BASE: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
        EXTRA_PKGS: ${POSTGRES_EXTRA_PKGS:-}
        PARTMAN_VERSION: ${POSTGRES_PARTMAN_VERSION:-}
    image: hetzbot-postgres:local
    container_name: postgres
    restart: unless-stopped
    environment:
      # Superuser password — used only by deploy helpers inside the host.
      # Per-service DBs and roles have their own generated passwords;
      # this one never leaves the host.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    secrets:
      - postgres_superuser
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
      options:
        tag: postgres

secrets:
  postgres_superuser:
    file: /etc/hetzbot/postgres_superuser

volumes:
  pgdata:
    name: pgdata
